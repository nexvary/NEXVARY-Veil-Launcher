name: Android Foundation Gate

on:
  push:
    branches: [ "dev/foundation" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate foundation files
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/nexvary/veil/VeilLauncherActivity.kt
          grep -q 'android.intent.category.HOME' app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_HIDDEN_PROFILES' app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "com.nexvary.veil"' app/build.gradle.kts
