name: Android Build Gate

on:
  push:
    branches: [ "dev/foundation" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: veil-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Resolve Android SDK manager
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android SDK 36
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle lintDebug --stacktrace || { cat app/build/reports/lint-results-debug.txt; exit 1; }
      - name: Build debug and unsigned release APKs
        run: gradle assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Veil-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Veil-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veil-unit-and-lint-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*

  android-ui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb shell settings put system screen_off_timeout 2147483647
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            VEIL_TEST_STATUS=0; gradle connectedDebugAndroidTest --stacktrace || VEIL_TEST_STATUS=$?; if [ "$VEIL_TEST_STATUS" -eq 0 ]; then python3 scripts/verify_lifecycle.py || VEIL_TEST_STATUS=$?; fi; mkdir -p ui-proof; adb shell dumpsys window > ui-proof/window-state.txt; adb shell dumpsys power > ui-proof/power-state.txt; adb pull /data/local/tmp/veil-ui-proof ui-proof || true; exit "$VEIL_TEST_STATUS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veil-Android-${{ matrix.api }}-test-reports
          path: |
            app/build/reports/androidTests/
            ui-proof/
